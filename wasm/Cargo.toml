[package]
name = "brickhollow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
engine = { path = "../../wasmOnly/crates/engine" }
# must match the installed wasm-bindgen CLI exactly (same pin as the engine)
wasm-bindgen = "=0.2.129"
glam = { version = "0.33", features = ["bytemuck", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the card faces are drawn on a 2D canvas (cardface.rs): same versions as the engine's
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasGradient", "ImageData", "Blob", "Url", "TextMetrics", "HtmlImageElement", "Navigator", "Clipboard", "MediaQueryList", "BlobPropertyBag", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "FileReader", "Location"] }

# standalone: not part of another workspace
[workspace]

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# no symbol names in the shipped wasm (the "name" section was 746 KB of 6.4 MB; panics and logs keep their messages)
strip = true
