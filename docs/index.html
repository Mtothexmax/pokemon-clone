<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#3a8f3f">
    <link rel="icon" href="data:,">
    <title>Brickhollow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #1d3b22; overflow: hidden; overscroll-behavior: none; }
        #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
        #start {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: radial-gradient(circle at 50% 35%, #7cc96b 0%, #3a8f3f 55%, #1d3b22 100%);
            color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px;
            cursor: pointer; user-select: none; -webkit-user-select: none; z-index: 10; transition: opacity 0.4s;
        }
        #start h1 { font-size: clamp(34px, 9vw, 64px); letter-spacing: 1px; text-shadow: 0 4px 0 #1d3b22; }
        #start p { font-size: 15px; opacity: 0.85; max-width: 420px; line-height: 1.5; }
        #play {
            font: 600 20px system-ui, sans-serif; color: #1d3b22; background: #ffd23f; border: 0; border-radius: 999px;
            padding: 14px 40px; box-shadow: 0 5px 0 #b8901a; cursor: pointer;
        }
        #status { font-size: 13px; opacity: 0.75; min-height: 1.2em; }
        #start.hidden { opacity: 0; pointer-events: none; }
        #play:disabled { background: #c9c9c9; box-shadow: 0 5px 0 #8a8a8a; }
        #log {
            display: none; position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 28vh; overflow: auto; z-index: 20;
            background: rgba(20, 0, 0, 0.82); color: #ffd0d0; font: 11px/1.35 ui-monospace, Consolas, monospace;
            padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; pointer-events: auto;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="start">
        <h1>Brickhollow</h1>
        <p>A little starter town. Walk around, visit the houses, the lab and the pond.<br>
           Keyboard: WASD to walk, Shift to run. Phone: the stick on the left.</p>
        <button id="play">Tap to play</button>
        <div id="status">Loading...</div>
    </div>
    <pre id="log"></pre>
    <script type="module">
        import { createGame } from "./main.js";
        const start = document.getElementById("start");
        const status = document.getElementById("status");
        const play = document.getElementById("play");
        const canvas = document.getElementById("canvas");
        const logEl = document.getElementById("log");
        const debug = new URLSearchParams(location.search).has("debug");
        const errors = [];
        let ready = false, failed = false;

        // problems stay on screen (a phone has no console): the last engine and page errors, newest last
        const showLog = () => {
            if (!errors.length && !debug) return;
            logEl.textContent = errors.slice(debug ? -40 : -14).join("\n");
            logEl.scrollTop = logEl.scrollHeight;
            logEl.style.display = "block";
        };
        const addError = (text) => {
            errors.push(String(text).slice(0, 300));
            if (failed || debug) showLog(); // collected quietly otherwise: shown when the start fails
        };
        const fail = (msg) => {
            failed = true;
            status.textContent = msg;
            play.disabled = true;
            play.textContent = "Cannot start";
            start.classList.remove("hidden");
            showLog();
        };
        window.addEventListener("error", (e) => addError("[page] " + e.message));
        window.addEventListener("unhandledrejection", (e) => addError("[page] " + e.reason));

        // WebGPU check before the engine: no API, or no adapter (the browser blocks this GPU)
        const ua = navigator.userAgent;
        const browser = (/(Chrome|Firefox|SamsungBrowser|HuaweiBrowser|HonorBrowser|EdgA|OPR)\/[\d.]+/.exec(ua) || [ua.slice(0, 60)])[0];
        let gpuOk = !!navigator.gpu;
        if (!navigator.gpu) {
            fail("This browser has no WebGPU (" + browser + "). On Android use a current Google Chrome (121 or newer).");
        } else {
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    gpuOk = false;
                    fail("WebGPU is switched off for this phone's graphics chip in " + browser +
                         ". In Chrome you can try chrome://flags/#enable-unsafe-webgpu (Enabled) and restart Chrome.");
                } else if (debug) {
                    const i = adapter.info || {};
                    addError("[gpu] " + [i.vendor, i.architecture, i.device, i.description].filter(Boolean).join(" ") + " | " + browser);
                }
            } catch (e) {
                gpuOk = false;
                fail("WebGPU failed to start: " + e);
            }
        }

        if (gpuOk) {
            const game = createGame({
                canvas, allowFullscreen: true, logRelay: true,
                onEngineMessage: (msg) => {
                    if (msg.type !== "engineLog") return;
                    for (const [level, text] of msg.lines)
                        if (level === "error" || debug) addError(text);
                },
            });
            game.ready.then(() => { ready = true; if (!failed) status.textContent = "Ready"; })
                .catch((e) => {
                    const code = e && e.code ? e.code : "";
                    fail(code === "webgpu_unavailable" ? "WebGPU could not start here: " + (e.message || "")
                        : code === "memory_unavailable" ? "Not enough memory for the game on this device: " + (e.message || "")
                        : "Could not start: " + (e && e.message ? e.message : e));
                });
            game.oncrash = () => fail("The game crashed. Reload the page.");
            // the first tap is the browser's permission to play sound (the engine resumes audio on pointerdown)
            start.addEventListener("pointerdown", () => {
                if (failed) return;
                start.classList.add("hidden");
                canvas.focus();
            });
        }
    </script>
</body>
</html>
