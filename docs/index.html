<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#3a8f3f">
    <link rel="icon" href="data:,">
    <title>Brickhollow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #1d3b22; overflow: hidden; overscroll-behavior: none; }
        #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
        #start {
            position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; background: radial-gradient(circle at 50% 35%, #7cc96b 0%, #3a8f3f 55%, #1d3b22 100%);
            color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px;
            cursor: pointer; user-select: none; -webkit-user-select: none; z-index: 10; transition: opacity 0.4s;
        }
        #start h1 { font-size: clamp(34px, 9vw, 64px); letter-spacing: 1px; text-shadow: 0 4px 0 #1d3b22; }
        #start p { font-size: 15px; opacity: 0.85; max-width: 420px; line-height: 1.5; }
        #play {
            font: 600 20px system-ui, sans-serif; color: #1d3b22; background: #ffd23f; border: 0; border-radius: 999px;
            padding: 14px 40px; box-shadow: 0 5px 0 #b8901a; cursor: pointer;
        }
        #status { font-size: 13px; opacity: 0.8; min-height: 1.2em; }
        #bar {
            width: min(320px, 80vw); height: 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.28);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35); overflow: hidden;
        }
        #fill {
            width: 0%; height: 100%; border-radius: 999px; transition: width 0.25s ease-out;
            background: linear-gradient(90deg, #ffd23f, #fff1a8 50%, #ffd23f); background-size: 200% 100%;
            animation: shimmer 1.2s linear infinite;
        }
        #start.loaded #bar { opacity: 0; transition: opacity 0.3s; }
        @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
        #play.waiting { background: #e9e2c4; box-shadow: 0 5px 0 #a99f78; color: #5a5440; }
        #start.hidden { opacity: 0; pointer-events: none; }
        #play:disabled { background: #c9c9c9; box-shadow: 0 5px 0 #8a8a8a; }
        #logbox {
            display: none; position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 20; pointer-events: auto;
            background: rgba(20, 0, 0, 0.86); border-radius: 8px; padding-bottom: env(safe-area-inset-bottom);
        }
        #logbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 0 10px; }
        #logbar span { flex: 1; color: #ffb0b0; font: 600 12px system-ui, sans-serif; }
        #copy {
            font: 600 13px system-ui, sans-serif; color: #1d3b22; background: #ffd23f; border: 0; border-radius: 999px;
            padding: 7px 16px; cursor: pointer; box-shadow: 0 2px 0 #b8901a;
        }
        #log {
            max-height: 26vh; overflow: auto; margin: 0; color: #ffd0d0; font: 11px/1.35 ui-monospace, Consolas, monospace;
            padding: 6px 10px 8px; white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="start">
        <h1>Brickhollow</h1>
        <p>A little starter town. Walk around, visit the houses, the lab and the pond.<br>
           Keyboard: WASD to walk, Shift to run. Phone: swipe to walk, tap to stop.</p>
        <div id="bar"><div id="fill"></div></div>
        <button id="play" class="waiting">Loading...</button>
        <div id="status">Loading the game...</div>
    </div>
    <div id="logbox">
        <div id="logbar"><span>Error details</span><button id="copy">Copy to clipboard</button></div>
        <pre id="log"></pre>
    </div>
    <script type="module">
        // Sound needs the threaded engine build, and that needs a cross-origin isolated page. GitHub Pages cannot send
        // the headers, so coi-sw.js adds them: the first visit registers it and reloads once.
        if (!self.crossOriginIsolated && window.isSecureContext && "serviceWorker" in navigator) {
            try {
                const reg = await navigator.serviceWorker.register("./coi-sw.js");
                if (!navigator.serviceWorker.controller && !sessionStorage.getItem("coi-reloaded")) {
                    sessionStorage.setItem("coi-reloaded", "1");
                    await navigator.serviceWorker.ready;
                    location.reload();
                    await new Promise(() => {}); // the page is going away
                }
                void reg;
            } catch (e) { console.warn("coi service worker:", e); }
        }
        // iPhones and iPads run the single-threaded build (ios/): the threaded one does not run in their Safari
        const appleTouch = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        const threaded = self.crossOriginIsolated && !appleTouch;
        const { createGame } = await import(threaded ? "./main.js" : "./ios/main.js");
        const bundleOpts = threaded ? {} : { baseUrl: new URL("./", location.href).href, wasmUrl: new URL("./ios/game.wasm", location.href).href };
        const start = document.getElementById("start");
        const status = document.getElementById("status");
        const play = document.getElementById("play");
        const canvas = document.getElementById("canvas");
        const logEl = document.getElementById("log");
        const logBox = document.getElementById("logbox");
        const copyBtn = document.getElementById("copy");
        const debug = new URLSearchParams(location.search).has("debug");
        const errors = [];     // shown: shortened
        const fullErrors = []; // copied: everything, as it came
        let ready = false, failed = false, gpuInfo = "";
        // the first load: the engine reports "[load] NN" (percent) and "[load] done" (st: load_watch); the page shows
        // the bar and opens the game only when the town is complete. A tap before that is remembered (and is the
        // browser's permission for sound): the game opens by itself once loaded
        const fill = document.getElementById("fill");
        let loaded = false, tapped = false, enginePct = 0;
        const setBar = (p) => { fill.style.width = Math.round(Math.max(0, Math.min(1, p)) * 100) + "%"; };
        const refresh = () => {
            if (failed) return;
            if (loaded && tapped) { start.classList.add("hidden"); canvas.focus(); return; }
            if (loaded) {
                start.classList.add("loaded");
                play.classList.remove("waiting");
                play.textContent = "Tap to play";
                status.textContent = "Ready";
            } else {
                const pct = Math.round(8 + enginePct * 0.92);
                play.textContent = tapped ? "Starting..." : "Loading... " + pct + "%";
                status.textContent = !ready ? "Loading the engine..." : enginePct < 85 ? "Loading the town..." : "Preparing the graphics...";
                setBar(pct / 100);
            }
        };
        const finishLoad = () => { if (loaded) return; loaded = true; setBar(1); setTimeout(refresh, 250); };

        // problems stay on screen (a phone has no console): the last engine and page errors, newest last
        const showLog = () => {
            if (!errors.length && !debug && !failed) return;
            logEl.textContent = errors.slice(debug ? -40 : -14).join("\n");
            logBox.style.display = "block";
            logEl.scrollTop = logEl.scrollHeight;
        };
        const addError = (text) => {
            errors.push(String(text).slice(0, 300));
            if (fullErrors.length < 300) fullErrors.push(String(text).slice(0, 4000));
            if (failed || debug) showLog(); // collected quietly otherwise: shown when the start fails
        };
        const fail = (msg) => {
            failed = true;
            status.textContent = msg;
            play.disabled = true;
            play.textContent = "Cannot start";
            start.classList.remove("hidden");
            showLog();
        };
        // the whole report for a bug: what failed, where, on which browser and graphics chip, and every error line
        const report = () => [
            "Brickhollow error report",
            "status: " + status.textContent,
            "page: " + location.href,
            "time: " + new Date().toISOString(),
            "browser: " + navigator.userAgent,
            "screen: " + innerWidth + "x" + innerHeight + " @" + devicePixelRatio + "x, canvas " + canvas.width + "x" + canvas.height,
            "build: " + (threaded ? "threaded" : "single-threaded") + ", isolated " + self.crossOriginIsolated,
            "gpu: " + (gpuInfo || "unknown"),
            "",
            ...fullErrors,
        ].join("\n");
        copyBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            const text = report();
            let ok = false;
            try { await navigator.clipboard.writeText(text); ok = true; } catch { /* no clipboard API here: the old way */ }
            if (!ok) {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.setAttribute("readonly", "");
                ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, text.length);
                try { ok = document.execCommand("copy"); } catch { ok = false; }
                ta.remove();
            }
            if (!ok) { // still nothing: the whole report, selected, to copy by hand
                logEl.textContent = text;
                getSelection().selectAllChildren(logEl);
            }
            copyBtn.textContent = ok ? "Copied \u2713" : "Select and copy";
            setTimeout(() => (copyBtn.textContent = "Copy to clipboard"), 2500);
        });
        logBox.addEventListener("pointerdown", (e) => e.stopPropagation());

        window.addEventListener("error", (e) => addError("[page] " + e.message));
        window.addEventListener("unhandledrejection", (e) => addError("[page] " + e.reason));

        // WebGPU check before the engine: no API, or no adapter (the browser blocks this GPU)
        const ua = navigator.userAgent;
        const browser = (/(Chrome|Firefox|SamsungBrowser|HuaweiBrowser|HonorBrowser|EdgA|OPR)\/[\d.]+/.exec(ua) || [ua.slice(0, 60)])[0];
        let gpuOk = !!navigator.gpu;
        if (!navigator.gpu) {
            fail("This browser has no WebGPU (" + browser + "). On Android use a current Google Chrome (121 or newer).");
        } else {
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    gpuOk = false;
                    fail("WebGPU is switched off for this phone's graphics chip in " + browser +
                         ". In Chrome you can try chrome://flags/#enable-unsafe-webgpu (Enabled) and restart Chrome.");
                } else {
                    const i = adapter.info || {};
                    gpuInfo = [i.vendor, i.architecture, i.device, i.description].filter(Boolean).join(" ") + " | " + browser;
                    if (debug) addError("[gpu] " + gpuInfo);
                }
            } catch (e) {
                gpuOk = false;
                fail("WebGPU failed to start: " + e);
            }
        }

        if (gpuOk) {
            const game = createGame({
                canvas, allowFullscreen: true, logRelay: true, ...bundleOpts,
                onEngineMessage: (msg) => {
                    if (msg.type !== "engineLog") return;
                    for (const [level, text] of msg.lines) {
                        if (level === "error" || debug) addError(text);
                        const m = /\[load\] (\d+|done)/.exec(text);
                        if (m) {
                            if (m[1] === "done") finishLoad();
                            else { enginePct = Math.max(enginePct, +m[1]); refresh(); }
                        }
                    }
                },
            });
            // until the engine runs, the bar creeps through its first few percent
            setBar(0.02);
            setTimeout(() => { if (!ready) setBar(0.05); }, 600);
            game.ready.then(() => {
                ready = true;
                refresh();
                setTimeout(finishLoad, 30000); // an engine that never reports: open anyway
            })
                .catch((e) => {
                    const code = e && e.code ? e.code : "";
                    fail(code === "webgpu_unavailable" ? "WebGPU could not start here: " + (e.message || "")
                        : code === "memory_unavailable" ? "Not enough memory for the game on this device: " + (e.message || "")
                        : "Could not start: " + (e && e.message ? e.message : e));
                });
            game.oncrash = () => fail("The game crashed. Reload the page.");
            // the first tap is the browser's permission to play sound (the engine resumes audio on pointerdown)
            start.addEventListener("pointerdown", () => {
                if (failed) return;
                tapped = true;
                refresh();
            });
        }
    </script>
</body>
</html>
